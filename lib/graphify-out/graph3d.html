<head>
  <style>
    body {
      margin: 0;
      background-color: #000;
    }
  </style>
  <script src="https://unpkg.com/3d-force-graph"></script>
</head>

<body>
  <div id="3d-graph"></div>
  <script>
    const Graph = ForceGraph3D()
      (document.getElementById('3d-graph'))
      .jsonUrl('graph.json') // Pesca i dati dalla tua mappa
      .nodeLabel('id')       // Mostra il nome del file al passaggio del mouse
      .nodeAutoColorBy('community'); // Colora i nodi in base al gruppo
  </script>
</body>
