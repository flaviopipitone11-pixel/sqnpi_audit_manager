name: sqnpi_audit_manager
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  excel: ^4.0.6
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.2.0
  flutter_riverpod: ^2.6.1
  dio: ^5.9.1
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.5
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1
  add_2_calendar: ^3.0.1
  url_launcher: ^6.3.2
  image_picker: ^1.1.2
  file_picker: ^11.0.2
  desktop_drop: ^0.7.0
  flutter_image_compress: ^2.3.0
  flutter_image_compress_macos: ^1.0.3
  intl: ^0.20.2
  image_painter: ^0.7.1
  fl_chart: ^1.2.0
  pdf: ^3.11.1
  printing: ^5.13.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  signature: ^6.3.0
  connectivity_plus: ^7.0.0
  geolocator: ^14.0.2
  timezone: ^0.11.0
  flutter_local_notifications: ^21.0.0
  flutter_map_cache: ^2.0.0+1
  dio_cache_interceptor: ^4.0.6
  http_cache_file_store: ^2.0.1
  table_calendar: ^3.1.3
  flutter_localizations:
    sdk: flutter
  open_filex: ^4.7.0
  collection: ^1.19.1
  image: ^4.3.0
  share_plus: ^12.0.2
  supabase_flutter: ^2.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.31.0
  build_runner: ^2.11.1
  flutter_launcher_icons: ^0.14.4
  sqflite_common_ffi: ^2.4.0+3
  msix: ^3.16.13

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  windows:
    generate: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_bios_new.webp
    - assets/images/logo_sqnpi.webp
    - assets/images/logo_bios_login.jpg
    - assets/images/seasons/
    - assets/checklists/CHECKLIST AGGIORNATA.xlsx
    - assets/templates/modello_import_aziende.xlsx
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

msix_config:
  display_name: SQNPI Audit Manager
  publisher_display_name: Flavio Pipitone
  identity_name: com.flaviopipitone.sqnpi
  msix_version: 1.0.0.0
  logo_path: assets/images/app_icon.png
  capabilities: internetClient, location, privateNetworkClientServer
