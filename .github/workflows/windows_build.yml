name: Windows Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    # Permette di far partire la build manualmente

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.41.5"

      - name: Get dependencies
        run: flutter pub get

      - name: Enable Windows support
        run: flutter config --enable-windows-desktop

      - name: Build Windows
        run: flutter build windows --release

      - name: Copy Visual C++ Redistributable DLLs
        run: |
          $msvcPath = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC" | Sort-Object Name -Descending | Select-Object -First 1
          $redistPath = Join-Path $msvcPath.FullName "x64\Microsoft.VC143.CRT"
          if (Test-Path $redistPath) {
            Get-ChildItem -Path $redistPath -Filter *.dll | Copy-Item -Destination "build\windows\x64\runner\Release\"
            Write-Host "Redistributable DLLs copied from $redistPath"
          } else {
            Write-Error "Redistributable path not found: $redistPath"
          }
        shell: pwsh


      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: build/windows/x64/runner/Release/
