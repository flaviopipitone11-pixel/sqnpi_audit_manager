name: Windows Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    # Permette di far partire la build manualmente

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.41.5"

      - name: Get dependencies
        run: flutter pub get

      - name: Enable Windows support
        run: flutter config --enable-windows-desktop

      - name: Build Windows
        run: flutter build windows --release

      - name: Copy Visual C++ Redistributable DLLs
        run: |
          $redistRoot = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC"
          if (Test-Path $redistRoot) {
            $dllPaths = Get-ChildItem -Path $redistRoot -Recurse -Filter "*.dll" | Where-Object { $_.FullName -like "*x64*" } | Select-Object -ExpandProperty DirectoryName -Unique
            foreach ($path in $dllPaths) {
              Write-Host "Copying DLLs from $path"
              Get-ChildItem -Path $path -Filter *.dll | Copy-Item -Destination "build\windows\x64\runner\Release\" -ErrorAction SilentlyContinue
            }
          }
          dir "build\windows\x64\runner\Release\"
        shell: pwsh

      - name: Prepare Clean Release Folder
        run: |
          # Crea una struttura per l'artefatto (una cartella dentro l'altra per lo zip)
          New-Item -ItemType Directory -Force -Path "build\Artifact\SQNPI_Audit_Manager"

          # Copia tutto il contenuto della build
          Copy-Item -Path "build\windows\x64\runner\Release\*" -Destination "build\Artifact\SQNPI_Audit_Manager\" -Recurse

          # Rinomina l'eseguibile per un aspetto più professionale
          Rename-Item -Path "build\Artifact\SQNPI_Audit_Manager\sqnpi_audit_manager.exe" -NewName "SQNPI_Audit_Manager.exe"

          # Rimuovi file di debug non necessari
          Remove-Item -Path "build\Artifact\SQNPI_Audit_Manager\*.pdb" -ErrorAction SilentlyContinue

          Write-Host "Struttura Artefatto preparata."
          dir "build\Artifact\SQNPI_Audit_Manager"
        shell: pwsh

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SQNPI_Audit_Manager_Windows
          path: build/Artifact/
