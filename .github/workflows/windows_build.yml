name: Windows Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    # Permette di far partire la build manualmente

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.41.5"

      - name: Get dependencies
        run: flutter pub get

      - name: Enable Windows support
        run: flutter config --enable-windows-desktop

      - name: Build Windows
        run: flutter build windows --release

      - name: Copy Visual C++ Redistributable DLLs
        run: |
          $redistRoot = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC"
          if (Test-Path $redistRoot) {
            $redistPath = (Get-ChildItem -Path $redistRoot -Recurse -Filter "msvcp140.dll" | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1).DirectoryName
            if ($redistPath) {
              Get-ChildItem -Path $redistPath -Filter *.dll | Copy-Item -Destination "build\windows\x64\runner\Release\"
              Write-Host "Redistributable DLLs copied from $redistPath"
            } else {
              Write-Error "Could not find x64 redistributable DLLs in $redistRoot"
            }
          } else {
            Write-Error "Visual Studio Redist root not found at $redistRoot"
          }
        shell: pwsh

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: build/windows/x64/runner/Release/
